name: Prepare
description: Prepare the environment for the workflow

inputs:
  cache:
    description: Whether to restore and save the cargo and firecracker caches. `enabled` or `disabled`.
    required: true
  prepare-for-build:
    description: Whether to install the host tools that building an artifact needs. `enabled` or `disabled`.
    required: true
  shared-cache-key:
    description: A name for jobs that build the same thing to share one cargo cache under. Empty keys the cache by job.
    required: false
    default: ""
  prepare-docs:
    description: Whether to install docs dependencies. `enabled` or `disabled`.
    required: false
    default: enabled

runs:
  using: composite
  steps:
    - name: Check inputs
      shell: bash
      env:
        CACHE: ${{ inputs.cache }}
        PREPARE_FOR_BUILD: ${{ inputs.prepare-for-build }}
        PREPARE_DOCS: ${{ inputs.prepare-docs }}
      run: |
        case "$CACHE" in
          enabled | disabled) ;;
          *)
            echo "prepare: cache must be 'enabled' or 'disabled', got '$CACHE'"
            exit 1
            ;;
        esac
        case "$PREPARE_FOR_BUILD" in
          enabled | disabled) ;;
          *)
            echo "prepare: prepare-for-build must be 'enabled' or 'disabled', got '$PREPARE_FOR_BUILD'"
            exit 1
            ;;
        esac
        case "$PREPARE_DOCS" in
          enabled | disabled) ;;
          *)
            echo "prepare: prepare-docs must be 'enabled' or 'disabled', got '$PREPARE_DOCS'"
            exit 1
            ;;
        esac

    - name: Install the host tools
      if: inputs.prepare-for-build == 'enabled'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y musl-tools e2fsprogs

    - name: Install Rust toolchain
      shell: bash
      run: |
        rustup toolchain install --no-self-update
        # The image ships its own `stable`, which drifts between images and would
        # otherwise land in the cargo cache key.
        rustup toolchain uninstall stable
        rustup show

    - name: Install the tools mise.toml names
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        install: true
        cache: true

    - name: Install the docs site's dependencies
      if: inputs.prepare-docs == 'enabled'
      shell: bash
      run: cd docs && bun install --frozen-lockfile

    - name: Cargo Cache
      if: inputs.cache == 'enabled'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        cache-on-failure: "true"
        shared-key: ${{ inputs.shared-cache-key }}

    - name: Firecracker Cache
      if: inputs.cache == 'enabled'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/nibrunner
        key: ${{ runner.os }}-firecracker-${{ hashFiles('crates/nibrunnerd/build.rs') }}
