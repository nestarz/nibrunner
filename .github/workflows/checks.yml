name: checks

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  codestyle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare
        with:
          cache: disabled
          prepare-for-build: disabled

      - name: Check Codestyle
        run: just fmt --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare
        with:
          cache: enabled
          prepare-for-build: disabled

      - name: Lint
        run: just lint

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare
        with:
          cache: enabled
          prepare-for-build: disabled

      - name: Run Tests
        run: just test

  # Every file in the tree that is written from the code rather than by hand.
  generated:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare
        with:
          cache: enabled
          prepare-for-build: disabled

      - name: Check the schemas are current
        run: just check-schema

      - name: Check the example configuration is current
        run: just check-config-example

      - name: Check the configuration schema is current
        run: just check-config-schema

      - name: Check the metrics are current
        run: just check-metrics

      - name: Check the filesystem socket's document is current
        run: just check-openapi

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare
        with:
          cache: enabled
          prepare-for-build: enabled

      - name: Check the machine can host
        run: ls -l /dev/net/tun /dev/kvm

      - name: Install nftables
        run: sudo apt-get install -y nftables

      - name: Build the integration tests
        run: just integration --build-only

      - name: Run the integration tests
        # sudo's secure_path drops the runner's PATH, so it is handed back; -E keeps HOME, which is
        # where rustup, cargo and mise live.
        run: sudo -E env "PATH=$PATH" just integration

      - name: Unpack remote OCI images
        timeout-minutes: 15
        env:
          NIBRUNNER_REMOTE_OCI: "1"
        run: sudo -E env "PATH=$PATH" just integration remote_oci

  # Beside `integration` rather than in it: both want the machine's nftables table and its taps,
  # and a job of its own is also a guest image built while the other tests are already running.
  #
  # Sharded because one microVM at a time is the only way to run these, and shared three ways
  # rather than one per family because a runner is not free: laying a shard out costs about as
  # long as a family takes to run, and this repository gets about five jobs at once, so a sixth
  # shard would wait for a runner longer than it would save. The three are balanced by measured
  # time — `sleep` snapshots and restores three times, `idle` waits out a timeout the protocol
  # will not let a document set under a minute, and everything else together is the third.
  integration-guest:
    name: integration-guest (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # A guest that never answers is a test failure, not a job that runs until GitHub stops it.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: cron
            families: cron
          - shard: sleep
            families: sleep
          - shard: idle+isolation+resources
            families: idle isolation resources
          - shard: lifecycle+volumes+tenant+raw
            families: lifecycle volumes tenant raw
          - shard: cache
            families: cache
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare
        with:
          cache: enabled
          prepare-for-build: enabled
          # Every shard builds the same test binary, so they share one cache rather than warming
          # one each.
          shared-cache-key: integration-guest

      - name: Check the machine can host
        run: ls -l /dev/net/tun /dev/kvm

      - name: Install guest networking tools
        run: sudo apt-get install -y nftables iproute2 iptables

      # The image is not checked in and every shard needs the same one, so it is built once for
      # whatever the pins and the guest's own code say and then restored. Keyed on the manifest as
      # committed, which is the input; what the build writes over it is part of what is kept.
      - name: Guest image cache
        id: guest-image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            guest/rootfs.ext4
            guest/manifest.json
          key: ${{ runner.os }}-guest-image-${{ hashFiles('guest/build-image.sh', 'guest/manifest.json', 'crates/init/**', 'crates/guest-contract/**') }}

      - name: Build the guest image
        if: steps.guest-image.outputs.cache-hit != 'true'
        run: just guest-image

      - name: Check the guest image is the one its manifest describes
        run: just verify-guest-image

      - name: Build the tests
        run: just integration-guest --build-only

      - name: Run the tests
        # sudo's secure_path drops the runner's PATH, so it is handed back; -E keeps HOME, which is
        # where rustup, cargo and mise live.
        env:
          FAMILIES: ${{ matrix.families }}
        run: |
          for family in $FAMILIES; do
            sudo -E env "PATH=$PATH" just integration-guest "$family::"
          done

  checks-passed:
    if: always()
    name: checks:required
    needs: [codestyle, lint, tests, generated, integration, integration-guest]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Some jobs failed or were cancelled"
            exit 1
          fi
          echo "All CI jobs passed"
