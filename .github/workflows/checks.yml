name: checks

on:
  pull_request:
  push:
    branches:
      - main

# Each hosted job consumes runner minutes; cancel work superseded by newer commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Hosted CI is costly: share setup and compilation across these checks.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare
        with:
          cache: enabled
          prepare-for-build: disabled
          shared-cache-key: verify

      - name: Check Codestyle
        run: just fmt --check

      - name: Lint
        run: just lint

      - name: Run Tests
        run: just test

      - name: Check the schemas are current
        run: just check-schema

      - name: Check the example configuration is current
        run: just check-config-example

      - name: Check the configuration schema is current
        run: just check-config-schema

      - name: Check the metrics are current
        run: just check-metrics

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare
        with:
          cache: enabled
          prepare-for-build: enabled
          prepare-docs: disabled

      - name: Check the machine can host
        run: ls -l /dev/net/tun /dev/kvm

      - name: Install nftables
        run: sudo apt-get install -y nftables

      - name: Build the integration tests
        run: just integration --no-run

      - name: Run the integration tests
        # sudo's secure_path drops the runner's PATH, so it is handed back; -E keeps HOME, which is
        # where rustup, cargo and mise live.
        run: sudo -E env "PATH=$PATH" just integration

  checks-passed:
    if: always()
    name: checks:required
    needs: [verify, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.verify.result }}" != "success" || "${{ needs.integration.result }}" != "success" ]]; then
            echo "Verification and integration must both pass"
            exit 1
          fi
          echo "All CI jobs passed"
