name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/build-release

      - name: Verify the release version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cargo metadata --no-deps --format-version 1 |
            jq -e --arg tag "$TAG" '.packages[] | select(.name == "nibrunnerd") | "v" + .version == $tag'

      - name: Generate release notes
        run: just release-notes > "$RUNNER_TEMP/release-notes.md"

      - name: Build the guest image
        run: just guest-image

      - name: Verify the guest image
        run: just verify-guest-image

      - name: Stage the assets
        run: just stage-release "$RUNNER_TEMP/dist"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest \
            "$RUNNER_TEMP/dist"/*

      - name: Install nibrun cli
        if: github.repository == 'ilbertt/nibrunner'
        uses: nibrunhq/setup-cli@a753b7a37b34d0389298f6b1647cff63a3993724 # v1.0.1
        with:
          version: latest

      - name: Deploy the docs site
        if: github.repository == 'ilbertt/nibrunner'
        run: |
          nib run docs/dist/app \
            --github-trusted-oidc \
            --app-id 01a09eb8-ea7a-73d2-98c8-bec0742e4fee
