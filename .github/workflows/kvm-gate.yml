name: kvm-gate

# One real host: GitHub's Ubuntu runners have KVM, systemd and root. This builds the daemon and the
# guest image from this ref, installs them the way deploy/install.sh does, and drives the daemon
# with desired-state documents from .github/kvm-gate/gate.sh. Run by hand:
# `gh workflow run kvm-gate.yml --ref <branch>`.
on:
  workflow_dispatch:
  # A dispatch finds only workflows the default branch carries, and this one is not there yet.
  push:
    branches:
      - mf/v5-candidate

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Room for snapshots and scratch disks
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: ./.github/actions/prepare
        with:
          cache: enabled
          prepare-for-build: enabled
          prepare-docs: disabled
          shared-cache-key: build-release

      - name: KVM for everyone on the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      # Docker on the runner drops forwarded traffic, which is every microVM's egress.
      - name: Let guests reach the network
        run: sudo iptables -P FORWARD ACCEPT

      - name: Build the daemon
        run: just build-release

      - name: Build the guest image
        run: just guest-image

      - name: Verify the guest image
        run: just verify-guest-image

      - name: Build the test tenant
        run: rustc --edition 2021 -O --target x86_64-unknown-linux-musl -o "$RUNNER_TEMP/tenant" .github/kvm-gate/tenant.rs

      - name: (e) The guest kernel's tmpfs carries the xattrs overlayfs needs
        run: |
          python3 - guest/vmlinux <<'PY'
          import pathlib, sys, zlib
          kernel = pathlib.Path(sys.argv[1]).read_bytes()
          config = zlib.decompress(kernel[kernel.find(b"IKCFG_ST") + 8:], 31).decode().splitlines()
          for option in ("CONFIG_TMPFS", "CONFIG_TMPFS_XATTR", "CONFIG_OVERLAY_FS"):
              print(next((line for line in config if line.startswith(option + "=")), f"# {option} is not set"))
          sys.exit(0 if "CONFIG_TMPFS_XATTR=y" in config else 1)
          PY

      - name: Stage a release
        run: |
          dist="$RUNNER_TEMP/dist"
          mkdir -p "$dist"
          install -m 0755 target/x86_64-unknown-linux-musl/release/nibrunnerd "$dist/nibrunnerd-linux-x64"
          install -m 0644 guest/vmlinux guest/rootfs.ext4 guest/manifest.json "$dist"
          cd "$dist" && sha256sum nibrunnerd-linux-x64 vmlinux rootfs.ext4 manifest.json > checksums.txt

      - name: Install it the way deploy/install.sh does
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q nftables e2fsprogs kmod passwd curl ca-certificates jq
          sudo install -m 0755 "$RUNNER_TEMP/dist/nibrunnerd-linux-x64" /usr/local/bin/nibrunnerd
          sudo nibrunnerd install --from "$RUNNER_TEMP/dist"
          sudo nibrunnerd start
          sudo cat /etc/nibrunner/config.toml

      - name: The gate, as root
        run: sudo bash .github/kvm-gate/gate.sh "$RUNNER_TEMP/tenant"

      - name: What the host logged
        if: always()
        run: |
          sudo journalctl -u nibrunnerd --no-pager -n 300 || true
          sudo sh -c 'for log in /var/lib/nibrunner/logs/*.log; do echo "== $log"; tail -n 40 "$log"; done' || true
