[workspace]
resolver = "2"
members = [
  "crates/protocol",
  "crates/guest-contract",
  "crates/nft-render",
  "crates/nibrunnerd",
  "crates/init",
  "crates/test-tenant",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Unlicense"
rust-version = "1.98"

[workspace.lints.rust]
missing_docs = "allow"
unsafe_code = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }

unwrap_used = "warn"
expect_used = "allow"
panic = "warn"
indexing_slicing = "allow"

cast_possible_truncation = "allow"
integer_division = "allow"

too_many_lines = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
protocol = { path = "crates/protocol", package = "nibrunner-protocol" }
guest-contract = { path = "crates/guest-contract", package = "nibrunner-guest-contract" }
nft-render = { path = "crates/nft-render", package = "nibrunner-nft-render" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
jsonschema = { version = "0.56", default-features = false }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "json"] }
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
tar = "0.4"
flate2 = "1"
# Stored and deflated entries, through the flate2 already here: what `zip -r` writes.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "process", "sync", "time", "signal"] }
futures = "0.3"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }
hyper = { version = "1", features = ["http1", "http2", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1", "http2", "server", "server-auto"] }
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
object_store = { version = "0.14", default-features = false, features = ["fs", "aws-base", "reqwest", "ring"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "http2", "json"] }
backhand = { version = "0.25", default-features = false, features = ["zstd"] }
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
nix = { version = "0.30", features = ["inotify", "ioctl", "signal", "process", "fs", "socket", "net", "time"] }
rtnetlink = { version = "0.23", default-features = false, features = ["tokio_socket"] }
netlink-packet-route = "0.33"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
mockall = "0.15"

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
