[package]
name = "nibrunnerd"
description = "One static daemon that turns a Linux machine with /dev/kvm into an app host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[lib]
name = "nibrunnerd"
path = "src/lib.rs"

[[bin]]
name = "nibrunnerd"
path = "src/main.rs"

[[bin]]
name = "config-example"
path = "src/bin/config-example.rs"

[[bin]]
name = "config-schema"
path = "src/bin/config-schema.rs"

[[bin]]
name = "metrics"
path = "src/bin/metrics.rs"

[[bin]]
name = "openapi"
path = "src/bin/openapi.rs"
required-features = ["schema"]

[[bin]]
name = "metrics-page"
path = "src/bin/metrics-page.rs"

[[test]]
name = "integration-guest"
path = "tests/guest/main.rs"

[dependencies]
base64.workspace = true
clap = { version = "4", features = ["derive"] }
protocol.workspace = true
oci-image.workspace = true
oci-client.workspace = true
guest-contract.workspace = true
nft-render.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
sqlx.workspace = true
toml.workspace = true
tar.workspace = true
flate2.workspace = true
zip.workspace = true
thiserror.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
tokio.workspace = true
futures.workspace = true
bytes.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
percent-encoding.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pemfile.workspace = true
object_store.workspace = true
reqwest.workspace = true
backhand.workspace = true
sha2.workspace = true
chacha20poly1305.workspace = true
hmac.workspace = true
hex.workspace = true
libc.workspace = true
nix.workspace = true
uuid.workspace = true
async-trait = "0.1"
mockall = { workspace = true, optional = true }
tempfile.workspace = true
xattr = "1"
filetime = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
rtnetlink.workspace = true
netlink-packet-route.workspace = true

[features]
testing = ["dep:mockall"]
schema = ["protocol/schema"]

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
mockall.workspace = true
jsonschema.workspace = true
nft-render.workspace = true
nibrunnerd = { path = ".", features = ["testing", "schema"] }

[build-dependencies]
sha2.workspace = true
hex.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls"] }
flate2 = "1"
tar = "0.4"

[lints]
workspace = true
